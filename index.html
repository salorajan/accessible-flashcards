<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Flashcards Web</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 20px auto; padding: 20px; background: #f6f8fa; text-align: center; color: #24292e; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #0366d6; }
        .card-container { background: #fff; padding: 30px; border: 2px solid #e1e4e8; border-radius: 15px; margin: 20px 0; min-height: 120px; display: flex; align-items: center; justify-content: center; font-size: 1.4em; font-weight: bold; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        button { padding: 15px; font-size: 1em; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; }
        .btn-main { background: #0366d6; grid-column: span 2; }
        .btn-correct { background: #2ea44f; }
        .btn-incorrect { background: #d73a49; }
        .btn-repeat { background: #6f42c1; grid-column: span 2; }
        #status { font-weight: bold; margin: 15px 0; color: #6a737d; }
        .hidden { display: none; }
        .error-msg { color: #d73a49; background: #ffeef0; padding: 20px; border-radius: 8px; border: 1px solid #f97583; text-align: left; margin-top: 20px; }
        code { background: #eee; padding: 2px 4px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Accessible Flashcards</h1>
        <div id="status">Initializing...</div>

        <div id="setup-ui" class="hidden">
            <label style="background:#2ea44f; color:white; padding:12px 20px; border-radius:6px; cursor:pointer; font-weight:bold;">
                📂 Upload flashcards.json
                <input type="file" id="file-input" accept=".json" style="display:none">
            </label>
        </div>

        <div id="app-ui" class="hidden">
            <div class="card-container"><div id="display-text">Ready. Press Space.</div></div>
            <div class="controls">
                <button class="btn-main" onclick="handleInput(' ')">Space: Question/Answer</button>
                <button class="btn-correct" onclick="handleInput('y')">Y: Correct</button>
                <button class="btn-incorrect" onclick="handleInput('n')">N: Incorrect</button>
                <button class="btn-repeat" onclick="handleInput('r')">R: Repeat</button>
            </div>
        </div>

        <div style="text-align:left; margin-top:40px; border-top:1px solid #ddd; padding-top:20px;">
            <p><small>Keys: Space, Y, N, R, Q | <a href="https://github.com/salorajan/accessible-flashcards">GitHub</a> | <a href="FLASHCARD_MANUAL.md">Manual</a></small></p>
        </div>
    </div>

    <script>
        const CDNS = [
            "https://cdn.jsdelivr.net/pyodite/v0.26.4/full/pyodite.js",
            "https://unpkg.com/pyodite@0.26.4/pyodite.js",
            "https://cdnjs.cloudflare.com/ajax/libs/pyodite/0.26.4/pyodite.js"
        ];
        
        let pyodite, currentCdnIndex = 0;
        const statusEl = document.getElementById('status');
        const synth = window.speechSynthesis;

        function speak(text) {
            synth.cancel();
            document.getElementById('display-text').innerText = text;
            synth.speak(new SpeechSynthesisUtterance(text));
        }

        function showError(msg) {
            const isLocal = window.location.protocol === 'file:';
            statusEl.innerHTML = `
                <div class="error-msg">
                    <strong>Fatal Error:</strong> ${msg}<br><br>
                    ${isLocal ? "<strong>Local Tip:</strong> Browsers block Python locally. Run <code>python -m http.server</code> and use <code>localhost:8000</code>." : "<strong>Web Tip:</strong> Try a different browser like Chrome or Edge."}
                    <br><br><small>Debug Info: Protocol=${window.location.protocol}, Wasm=${typeof WebAssembly !== 'undefined'}</small>
                </div>`;
        }

        function loadScript(url) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = url;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        async function tryLoadPyodite() {
            if (typeof WebAssembly === 'undefined') {
                showError("Your browser does not support WebAssembly, which is required.");
                return;
            }

            for (let i = 0; i < CDNS.length; i++) {
                try {
                    statusEl.innerText = `Connecting to engine (Try ${i+1}/${CDNS.length})...`;
                    await loadScript(CDNS[i]);
                    if (typeof loadPyodite !== 'undefined') {
                        statusEl.innerText = "Starting Python Core... (15MB)";
                        pyodite = await loadPyodite();
                        statusEl.innerText = "System Ready. Upload your JSON.";
                        document.getElementById('setup-ui').classList.remove('hidden');
                        return;
                    }
                } catch (e) {
                    console.warn(`CDN ${CDNS[i]} failed. Trying next...`);
                }
            }
            showError("All Python engines failed to load. Your network may be blocking them.");
        }

        window.onload = tryLoadPyodite;

        document.getElementById('file-input').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file || !pyodite) return;
            const text = await file.text();
            try {
                pyodite.globals.set("json_data", text);
                await pyodite.runPythonAsync(`
import json, random
class M:
    def __init__(self, d):
        self.c = json.loads(d); random.shuffle(self.c); self.i = 0; self.s = {"c":0,"i":0}; self.st = "S"
    def act(self, k):
        if self.st == "S":
            if k == " ": self.st = "Q"; return f"Card 1. {self.c[0]['question']}"
            return "Press Space."
        if self.st == "Q":
            if k == " ": self.st = "A"; return f"Answer: {self.c[self.i]['answer']}"
            if k == "r": return self.c[self.i]['question']
        if self.st == "A":
            if k == "y": self.s["c"] += 1; return self.nxt("Correct!")
            if k == "n": self.s["i"] += 1; return self.nxt("Incorrect.")
            if k == "r": return self.c[self.i]['answer']
        if k == "q": return f"Done. {self.s['c']} right."
        return "Command error."
    def nxt(self, f):
        self.i += 1
        if self.i < len(self.c): self.st = "Q"; return f"{f} Card {self.i+1}. {self.c[self.i]['question']}"
        return f"{f} Session complete. {self.s['c']} correct."
mgr = M(json_data)`);
                document.getElementById('setup-ui').classList.add('hidden');
                document.getElementById('app-ui').classList.remove('hidden');
                speak("Ready. Press Space to start.");
            } catch (err) { statusEl.innerText = "Error: Invalid JSON."; }
        };

        async function handleInput(k) {
            if (!pyodite) return;
            speak(await pyodite.runPythonAsync(`mgr.act("${k}")`));
        }

        window.onkeydown = (e) => {
            const keys = {' ': ' ', 'y': 'y', 'n': 'n', 'r': 'r', 'q': 'q'};
            if (keys[e.key.toLowerCase()]) { e.preventDefault(); handleInput(keys[e.key.toLowerCase()]); }
        };
    </script>
</body>
</html>
