<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Flashcards Web</title>
    <script src="https://cdn.jsdelivr.net/pyodite/v0.25.0/full/pyodite.js"></script>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            max-width: 800px; 
            margin: 20px auto; 
            padding: 20px; 
            background: #f0f4f8;
            text-align: center;
        }
        .card-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-top: 20px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .controls {
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        button {
            padding: 20px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        .btn-main { background: #0366d6; color: white; grid-column: span 2; }
        .btn-correct { background: #2ea44f; color: white; }
        .btn-incorrect { background: #d73a49; color: white; }
        .btn-repeat { background: #6f42c1; color: white; grid-column: span 2; }
        
        #status { margin-top: 20px; color: #666; font-style: italic; }
        #file-input-label {
            display: inline-block;
            background: #e1e4e8;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #file-input { display: none; }
        
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Accessible Flashcards Web</h1>
    
    <label id="file-input-label" for="file-input">📂 Upload flashcards.json</label>
    <input type="file" id="file-input" accept=".json">
    
    <div id="setup-msg">Please upload a JSON file to start.</div>

    <div id="app-ui" class="hidden">
        <div class="card-container">
            <h2 id="display-text">Welcome! Press Space to begin.</h2>
        </div>

        <div class="controls">
            <button class="btn-main" onclick="handleInput(' ')">Space: Question / Answer</button>
            <button class="btn-correct" onclick="handleInput('y')">Y: Correct</button>
            <button class="btn-incorrect" onclick="handleInput('n')">N: Incorrect</button>
            <button class="btn-repeat" onclick="handleInput('r')">R: Repeat Audio</button>
        </div>
        
        <p id="status">Press Q to quit and hear score.</p>
    </div>

    <script>
        let pyodite;
        let synth = window.speechSynthesis;
        
        // --- Accessibility Speech Logic ---
        function speak(text) {
            // Cancel any ongoing speech
            synth.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            document.getElementById('display-text').innerText = text;
            synth.speak(utterance);
        }

        async function initPyodite() {
            document.getElementById('status').innerText = "Loading Python environment...";
            pyodite = await loadPyodite();
            document.getElementById('status').innerText = "Ready. Upload JSON to start.";
        }

        initPyodite();

        // --- File Handling ---
        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const text = await file.text();
            
            // Inject Python Logic
            await pyodite.runPythonAsync(`
                import json
                import random

                class CardManager:
                    def __init__(self, data_json):
                        self.cards = json.loads(data_json)
                        random.shuffle(self.cards)
                        self.index = 0
                        self.score = {"correct": 0, "incorrect": 0}
                        self.state = "START" # START, QUESTION, ANSWER, END

                    def get_next_action(self, key):
                        if self.state == "START":
                            if key == " ":
                                self.state = "QUESTION"
                                return f"Card 1. {self.cards[0]['question']}"
                            return "Welcome. Press Space to start."

                        if self.state == "QUESTION":
                            if key == " ":
                                self.state = "ANSWER"
                                return f"The answer is: {self.cards[self.index]['answer']}"
                            if key == "r":
                                return self.cards[self.index]['question']

                        if self.state == "ANSWER":
                            if key == "y":
                                self.score["correct"] += 1
                                return self.next_card("Correct!")
                            if key == "n":
                                self.score["incorrect"] += 1
                                return self.next_card("Incorrect.")
                            if key == "r":
                                return self.cards[self.index]['answer']
                            if key == " ":
                                return "Press Y for correct or N for incorrect."

                        if key == "q":
                            return self.get_summary()
                        
                        return "Invalid key."

                    def next_card(self, feedback):
                        self.index += 1
                        if self.index < len(self.cards):
                            self.state = "QUESTION"
                            return f"{feedback} Card {self.index + 1}. {self.cards[self.index]['question']}"
                        else:
                            self.state = "END"
                            return f"{feedback} {self.get_summary()}"

                    def get_summary(self):
                        return f"Session finished. You got {self.score['correct']} correct and {self.score['incorrect']} incorrect."

                manager = CardManager('''${text.replace(/'/g, "\\'")}''')
            `);
            
            document.getElementById('setup-msg').classList.add('hidden');
            document.getElementById('app-ui').classList.remove('hidden');
            speak("Cards loaded. Press Space to hear the first question.");
        });

        // --- Keyboard & Button Interop ---
        async function handleInput(key) {
            if (!pyodite) return;
            
            const response = await pyodite.runPythonAsync(`manager.get_next_action("${key}")`);
            speak(response);
        }

        window.addEventListener('keydown', (e) => {
            const keyMap = {
                ' ': ' ',
                'y': 'y',
                'n': 'n',
                'r': 'r',
                'q': 'q'
            };
            if (keyMap[e.key.toLowerCase()]) {
                e.preventDefault();
                handleInput(keyMap[e.key.toLowerCase()]);
            }
        });
    </script>
</body>
</html>
